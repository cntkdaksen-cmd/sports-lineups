name: Refresh lineup projections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-projections.py'
      - 'scripts/check-player-names.mjs'
      - 'scripts/collect-player-names.mjs'
      - 'scripts/player-name-exceptions.json'
      - 'dist/player-ko.js'
      - 'dist/team-ko.json'
      - 'scripts/team-name-review.json'
      - 'scripts/player-name-review.json'
      - 'scripts/player-name-source-review.json'
      - 'scripts/build-name-catalog.mjs'
      - 'dist/football-ko.js'
      - 'dist/app.js'
      - '.github/workflows/refresh-lineups.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lineups
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch current lineup projections
        run: python3 scripts/update-projections.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build approved Korean full-name catalog
        run: node scripts/build-name-catalog.mjs
      - name: Audit Korean names across all leagues
        run: node scripts/check-player-names.mjs --audit
      - name: Collect names from live lineup and injury renderers
        run: node scripts/collect-player-names.mjs
      - name: Audit live player names
        run: node scripts/check-player-names.mjs --inventory scripts/player-name-live-inventory.json
      - name: Prepare unreviewed name search queue
        if: always()
        run: node scripts/build-name-catalog.mjs --queue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: player-name-audit
          path: |
            scripts/player-name-audit.json
            scripts/player-name-live-audit.json
            scripts/player-name-live-inventory.json
            scripts/team-name-live-audit.json
            scripts/name-review-queue.json
          retention-days: 3
      - name: Commit lineup changes
        run: |
          if ! git diff --quiet -- dist/projections.json dist/name-catalog.json dist/team-ko.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add dist/projections.json dist/name-catalog.json dist/team-ko.json
            git commit -m "chore: refresh lineups and approved full names"
            git pull --rebase
            git push
          fi
