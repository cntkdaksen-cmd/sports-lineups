name: Publish reviewed full names

on:
  push:
    branches: [main]
    paths:
      - 'dist/player-ko.js'
      - 'dist/football-ko.js'
      - 'dist/app.js'
      - 'dist/win-probability.js'
      - 'scripts/check-win-probability.mjs'
      - 'scripts/check-embedded-storage.mjs'
      - 'scripts/check-baseball-pitchers.mjs'
      - 'scripts/fixtures/baseball-name-review.json'
      - 'dist/team-ko.json'
      - 'scripts/*name*.json'
      - 'scripts/build-name-catalog.mjs'
      - 'scripts/collect-player-names.mjs'
      - 'scripts/resolve-player-names.py'
      - 'scripts/publish-generated.sh'
      - 'scripts/test_resolve_player_names.py'
      - 'scripts/check-player-names.mjs'
      - '.github/workflows/refresh-names.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-reviewed-names
  cancel-in-progress: false

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sandboxed board initialization
        run: node scripts/check-embedded-storage.mjs
      - name: Validate baseball pitchers and major games
        run: node scripts/check-baseball-pitchers.mjs
      - name: Validate game outcome estimates
        run: node scripts/check-win-probability.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test name verification
        run: python3 scripts/test_resolve_player_names.py
      - name: Collect current names from every league
        run: node scripts/collect-player-names.mjs --allow-partial
      - name: Search Google and Naver and verify Korean player names
        run: python3 scripts/resolve-player-names.py
      - name: Build approved Korean full names
        run: node scripts/build-name-catalog.mjs
      - name: Validate player and team rendering
        run: node scripts/check-player-names.mjs --inventory scripts/fixtures/player-name-inventory.json --require-reviewed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automatic-name-review
          path: |
            scripts/player-name-live-inventory.json
            scripts/player-name-auto-review.json
            scripts/player-name-search-state.json
            scripts/player-name-run-report.json
          retention-days: 7
      - name: Publish the name catalog
        run: |
          bash scripts/publish-generated.sh 'chore: publish approved full names' dist/name-catalog.json dist/team-ko.json scripts/player-name-auto-review.json scripts/player-name-search-state.json scripts/player-name-run-report.json
